    #tips-layer { position:fixed; left:0; top:0; width:100%; height:100%; pointer-events:none; }
    .tip { position:absolute; width:220px; height:50px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:600; color:#000; box-shadow:0 4px 12px rgba(0,0,0,.25); pointer-events:auto; z-index:1000; user-select:none; }#question-backdrop { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; z-index:2000; }
    #question-backdrop.show { display:flex; }
    #question { background:#fff; color:#000; border-radius:16px; width:400px; padding:24px 24px 12px; box-shadow:0 12px 40px rgba(0,0,0,.4); text-align:center; }
    #question h1 { margin:0 0 16px; font-size:22px; }
    .btn-row { display:flex; gap:20px; justify-content:center; margin:16px 0 8px; }
    .btn { appearance:none; border:0; border-radius:10px; padding:10px 16px; font-size:16px; font-weight:700; cursor:pointer; box-shadow:0 6px 16px rgba(0,0,0,.2); }

    .btn-no  { background:#ff8080; }

    #canvas-wrap { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:#000; z-index:1500; }
    #heartCanvas { width:840px; height:680px; image-rendering: pixelated; }</style>

<style id="sakura-theme">
  :root{
    --sakura-50:#fff0f6;
    --sakura-100:#ffe6f0;
    --sakura-200:#ffd5e5;
    --sakura-300:#ffbdd6;
    --sakura-400:#ff9fc1;
    --sakura-500:#f57aa8;
    --sakura-600:#e26398;
    --sakura-text:#7a2f47;
    --card-bg:#ffffff;
  }
  /* 背景改为樱花粉渐变 */
  html, body{
    height:100%;
    background:
      radial-gradient(1200px 700px at 15% -10%, var(--sakura-50), transparent 70%),
      radial-gradient(1200px 700px at 110% 0%,  var(--sakura-100), transparent 70%),
      linear-gradient(180deg, var(--sakura-50) 0%, var(--sakura-100) 40%, var(--sakura-200) 100%);
    background-attachment: fixed;
    color: var(--sakura-text);
  }
  /* 飘落樱花容器（置底） */
  #sakuraContainer{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index: 0;
  }
  /* 花瓣形状与动画 */
  .sakura{
    position:absolute;
    left:0;
    top:-10vh;
    width:14px;
    height:12px;
    background: var(--sakura-300);
    border-radius: 15px 3px 15px 3px / 12px 10px 12px 10px;
    box-shadow: 0 0 6px rgba(255,175,200,.45);
    opacity:.85;
    transform: rotate(45deg);
    animation-name: sakuraFall, sakuraSway;
    animation-timing-function: linear, ease-in-out;
    animation-iteration-count: infinite, infinite;
    will-change: transform, margin-left;
  }
  @keyframes sakuraFall{
    0%   { transform: translateY(-10vh) rotate(45deg); }
    100% { transform: translateY(110vh) rotate(405deg); }
  }
  @keyframes sakuraSway{
    0%   { margin-left: 0; }
    50%  { margin-left: 40px; }
    100% { margin-left: 0; }
  }

  /* 覆盖原样式：提示卡片色与文字 */
  .tip{
    color: var(--sakura-text) !important;
    border: 1px solid var(--sakura-300);
    box-shadow: 0 6px 18px rgba(230,120,160,.18);
    font-weight: 600;
  }

  /* 弹窗与按钮配色 */
  #question-backdrop{
    background: rgba(255, 192, 203, .25) !important; /* 淡粉遮罩 */
  }
  #question{
    background: var(--card-bg) !important;
    color: var(--sakura-text) !important;
    border-radius: 18px !important;
    box-shadow: 0 18px 50px rgba(220, 110, 150, .25) !important;
  }
  .btn{
    color:#fff !important;
  }
  .btn-yes{ background: var(--sakura-500) !important; }
  .btn-no { background: #f2a1a1 !important; }

  /* 画布层透明以露出粉色背景 */
  #canvas-wrap{
    background: transparent !important;
    z-index: 1;  /* 主内容高于花瓣 */
  }
  #tips-layer{ z-index: 2; } /* 提示在上层 */
</style>

    const bgColors = ['#ffeef5','#ffd9e6','#ffc9dc','#ffb3cf','#ff9fc1','#ff8ab5','#ffd5e5','#ffe6ef','#ffd1e8'];

    const tipsLayer = document.getElementById('tips-layer');

    const btnYes = document.getElementById('btnYes');

    let screenW = window.innerWidth;
    let screenH = window.innerHeight;
    let currentTip = 0;
    const tipWindows = [];

    function heartFunctionTips(t, scale=25) {
      const x = 16 * Math.sin(t)**3;
      const y = -(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
      let px = x*scale + (screenW>>1);
      let py = y*scale + Math.floor(screenH/3);
      // 保证视口内
      px = Math.max(0, Math.min(px, screenW - windowW));
      py = Math.max(0, Math.min(py, screenH - windowH));
      return [px|0, py|0];
    }

    function makeTip(i) {

      tip.className = 'tip';
      tip.style.background = bgColors[i % bgColors.length];

      tip.style.top  = y + 'px';
      tipsLayer.appendChild(tip);
      tipWindows.push(tip);
    }

    function showNextTip() {

        currentTip++;

      } else {

    // —— 心形动画 ——
    function heartFunctionAnimation(t, shrinkRatio=IMAGE_ENLARGE) {
      let x = 17 * Math.sin(t)**3;
      let y = -(16*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(3*t));
      x *= IMAGE_ENLARGE; y *= IMAGE_ENLARGE;
      x += CENTER_X; y += CENTER_Y;
      return [x|0, y|0];
    }
    function scatterInside(x, y, beta=0.15) {
      const ratio_x = -beta * Math.log(1 - Math.random());
      const ratio_y = -beta * Math.log(1 - Math.random());
      const dx = ratio_x * (x - CENTER_X);
      const dy = ratio_y * (y - CENTER_Y);
      return [x - dx, y - dy];
    }
    function shrink(x,y,ratio) {
      const force = -1 / Math.pow(((x-CENTER_X)**2 + (y-CENTER_Y)**2), 0.6);
      const dx = ratio * force * (x - CENTER_X);
      const dy = ratio * force * (y - CENTER_Y);
      return [x - dx, y - dy];
    }
    function curve(p) { return 2 * (2 * Math.sin(4*p)) / (2*Math.PI); }
    function randInt(a,b){ return (Math.random()*(b-a+1) + a)|0; }

    class Heart {
      constructor(generateFrame=20) {
        this.points = new Set();
        this.edge = new Set();
        this.center = new Set();
        this.allPoints = new Array(generateFrame);
        this.generateFrame = generateFrame;
        this._build(2000);
        for (let f=0; f<generateFrame; f++) this._calc(f);
      }
      _key(x,y){ return (x|0)+','+(y|0); }

      _build(number) {
        for (let i=0;i<number;i++) {
          const t = Math.random()*Math.PI*2;
          const [x,y] = heartFunctionAnimation(t);
          this.points.add(this._key(x,y));
        }
        const pts = Array.from(this.points).map(s=>s.split(',').map(Number));
        // 边缘扩散
        for (const [x0,y0] of pts) {
          for (let k=0;k<3;k++){
            const [x,y] = scatterInside(x0,y0,0.05);
            this.edge.add(this._key(x,y));
          }
        }
        // 中心扩散
        for (let k=0;k<10000;k++){
          const [sx,sy] = pts[randInt(0, pts.length-1)];
          const [x,y] = scatterInside(sx,sy,0.27);
          this.center.add(this._key(x,y));
        }
        this.pointsArr = Array.from(this.points).map(s=>s.split(',').map(Number));
        this.edgeArr   = Array.from(this.edge).map(s=>s.split(',').map(Number));
        this.centerArr = Array.from(this.center).map(s=>s.split(',').map(Number));
      }

      static calcPosition(x,y,ratio) {
        const force = 1 / Math.pow(((x - CENTER_X)**2 + (y - CENTER_Y)**2), 0.420);
        const dx = ratio * force * (x - CENTER_X) + randInt(-1,1);
        const dy = ratio * force * (y - CENTER_Y) + randInt(-1,1);
        return [x - dx, y - dy];
      }

      _calc(frame) {
        const ratio = 15 * curve(frame/10 * Math.PI);
        const haloRadius = (4 + 6 * (1 + curve(frame/10 * Math.PI)))|0;
        const haloNumber = (3000 + 4000 * Math.abs(curve(frame/10 * Math.PI)**2))|0;

        const all = [];
        // 光环
        const haloSet = new Set();
        for (let i=0;i<haloNumber;i++){
          const t = Math.random()*Math.PI*2;
          let [x,y] = heartFunctionAnimation(t, -15);
          [x,y] = shrink(x,y,haloRadius);
          const key = (x|0)+','+(y|0);
          if (!haloSet.has(key)) {
            haloSet.add(key);
            x += randInt(-60,60); y += randInt(-60,60);
            const size = [1,1,2][randInt(0,2)];
            all.push([x,y,size]);
            all.push([x+20,y+20,size]);
            all.push([x-20,y-20,size]);
            all.push([x+20,y-20,size]);
            all.push([x-20,y+20,size]);
          }
        }
        // 轮廓
        for (let i=0;i<this.pointsArr.length;i++){
          let [x,y] = this.pointsArr[i];
          [x,y] = Heart.calcPosition(x,y,ratio);
          const size = randInt(1,3);
          all.push([x,y,size]);
        }
        // 内容（边缘扩散）
        for (let i=0;i<this.edgeArr.length;i++){
          let [x,y] = this.edgeArr[i];
          [x,y] = Heart.calcPosition(x,y,ratio);
          const size = randInt(1,2);
          all.push([x,y,size]);
        }
        // 内容（中心扩散）
        for (let i=0;i<this.centerArr.length;i++){
          let [x,y] = this.centerArr[i];
          [x,y] = Heart.calcPosition(x,y,ratio);
          const size = randInt(1,2);
          all.push([x,y,size]);
        }
        this.allPoints[frame] = all;
      }

      render(frame) {
        const data = this.allPoints[frame % this.generateFrame];
        ctx.clearRect(0,0,CANVAS_WIDTH,CANVAS_HEIGHT);
        ctx.fillStyle = HEART_COLOR;
        for (let i=0;i<data.length;i++) {
          const [x,y,s] = data[i];
          ctx.fillRect(x, y, s, s);
        }
      }
    }

    function startHeartAnimation() {
  canvasWrap.style.display = 'flex';
  const heart = new Heart(20); // 预生成 20 帧

  // —— 一开始就放慢心跳：使用固定较慢的帧间隔 ——
  let frame = 0;
  let last = 0;
  const interval = 180; // 毫秒；约 ~7fps，可按需改 100~180

  function tick(ts){
    if (ts - last >= interval) {
      heart.render(frame++);
      last = ts;
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

    // —— 交互 ——
    btnYes.addEventListener('click', () => {
      for (const el of tipWindows) el.remove();
      questionBackdrop.classList.remove('show');
      startHeartAnimation();
    });
    btnNo.addEventListener('click', () => {

      document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#bbb;font:600 20px/1.4 system-ui">已退出</div>';
    });

    window.addEventListener('resize', () => {
      screenW = window.innerWidth; screenH = window.innerHeight;
    });

    console.log(`将在屏幕上创建一个包含 ${totalWindows} 个窗口的爱心轨迹...`);
    showNextTip();
  })();
  </script>

<script id="sakura-script">
(function () {
  const N = 42; // 花瓣数量，想更密可调大
  let wrap = document.getElementById('sakuraContainer');
  if (!wrap) {
    wrap = document.createElement('div');
    wrap.id = 'sakuraContainer';
    wrap.setAttribute('aria-hidden','true');
    document.body.prepend(wrap);
  }
  for (let i = 0; i < N; i++) {
    const s = document.createElement('span');
    s.className = 'sakura';
    const left = Math.random() * 100;                // vw
    const size = 0.6 + Math.random() * 0.9;         // 0.6 ~ 1.5
    const fall = 9000 + Math.random() * 11000;      // 9s ~ 20s
    const sway = 3000 + Math.random() * 3000;       // 3s ~ 6s
    const delay = (Math.random() * -8000) | 0;      // 负延迟用于打散
    s.style.left = left + 'vw';
    s.style.animationDuration = fall + 'ms, ' + sway + 'ms';
    s.style.animationDelay = delay + 'ms, ' + (delay/2) + 'ms';
    s.style.transform = 'rotate(45deg) scale(' + size + ')';
    if (Math.random() < 0.30) s.style.background = 'var(--sakura-400)';
    if (Math.random() < 0.15) s.style.opacity = 0.75;
    wrap.appendChild(s);
  }
})();
</script>
